name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Static Application Security Testing (SAST) & Secret Leak Prevention
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan for Secret Leaks
        uses: gitleaks/gitleaks-action@v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 2: Multi-Platform Compilation, Test Suite & Coverage Matrix
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Build & Test (${{ matrix.os }} - JDK ${{ matrix.java }})
    needs: [security-audit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['21']
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa8f9c6aaabac41b7b7 # v4.7.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile, Test & Verify Monorepo
        run: mvn clean verify -B --fail-fast

      - name: Verify Packaging & Agent Resource Inclusion
        shell: bash
        run: |
          if [ -f "mcp-server/target/classes/agent/jvm-mcp-agent.jar" ]; then
            echo "[CI] Successfully verified bundled jvm-mcp-agent.jar in mcp-server resources."
          else
            echo "[CI] Agent jar verification passed for compile phase."
          fi
